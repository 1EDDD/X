name: Build X unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "X/**"
      - "project.yml"
      - ".github/workflows/build-unsigned-ipa.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project X.xcodeproj \
            -scheme X \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/X.app"
          test -d "$APP_PATH"
          mkdir -p build/ipa/Payload
          cp -R "$APP_PATH" build/ipa/Payload/X.app
          ditto -c -k --sequesterRsrc --keepParent build/ipa/Payload build/X-unsigned.ipa
          shasum -a 256 build/X-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: X-unsigned-ipa
          path: build/X-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
